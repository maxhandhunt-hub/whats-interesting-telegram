name: Test and deploy Mini App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m pip install --disable-pip-version-check requests==2.34.2 feedparser==6.0.14
      - run: python -m unittest discover -s worker_tests -q
      - run: npm run build
        env:
          VITE_BACKEND_URL: https://igwvbcmpkipcoowzsaiu.supabase.co/functions/v1/telegram-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
